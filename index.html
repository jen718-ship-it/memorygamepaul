<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Memory Card Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti Library for Victory Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* Google Fonts Creepster for Bloody Ghost / Dripping look */
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;600;800&display=swap');

    body {
      font-family: 'Creepster', cursive, sans-serif;
      background: radial-gradient(circle at center, #1a0933 0%, #0d041a 70%, #05020a 100%);
      color: #f3f4f6;
      user-select: none;
    }

    .spooky-font {
      font-family: 'Creepster', cursive, sans-serif;
    }

    /* Dripping Bloody Ghost Text Shadow Effect */
    .bloody-text {
      color: #ff3300;
      text-shadow: 
        0 0 10px #ff0000,
        0 4px 0 #990000,
        0 8px 0 #660000,
        0 12px 15px rgba(255, 0, 0, 0.8);
      letter-spacing: 2px;
    }

    /* 3D Card Flip CSS */
    .card-container {
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      transform: rotateY(180deg);
      box-shadow: 0 0 15px #10b981;
      border-color: #10b981;
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }

    .card-back {
      background: linear-gradient(135deg, #2d124d 0%, #15062b 100%);
      border: 2px solid #ff7700;
      box-shadow: inset 0 0 12px rgba(255, 119, 0, 0.2), 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    .card-front {
      background: linear-gradient(135deg, #1f1035 0%, #321654 100%);
      border: 2px solid #a855f7;
      transform: rotateY(180deg);
      box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
    }

    /* Shake animation for wrong match */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden">

  <!-- Header & Stats Bar -->
  <header class="w-full max-w-md flex flex-col items-center mb-4 text-center">
    <h1 class="spooky-font bloody-text text-4xl sm:text-5xl mb-2 transition-transform duration-300 hover:scale-105">
      HALLOWEEN MEMORY
    </h1>
    
    <div class="w-full flex justify-between items-center bg-purple-950/70 border border-purple-800/60 rounded-xl px-4 py-3 backdrop-blur-sm shadow-lg mb-2">
      <div class="flex items-center space-x-1 sm:space-x-2">
        <span class="spooky-font text-xl sm:text-2xl text-purple-300">FLIPS:</span>
        <span id="flips-display" class="spooky-font text-2xl sm:text-3xl text-orange-400">0</span>
      </div>
      <div class="flex items-center space-x-1 sm:space-x-2">
        <span class="spooky-font text-xl sm:text-2xl text-purple-300">TIME:</span>
        <span id="timer-display" class="spooky-font text-2xl sm:text-3xl text-green-400">0s</span>
      </div>
    </div>

    <button onclick="restartGame()" class="spooky-font text-xl text-orange-300 bg-purple-900/80 hover:bg-orange-600 hover:text-black border border-orange-500/50 px-5 py-1.5 rounded-lg transition-all transform active:scale-95 shadow-md">
      🔄 RESET GAME
    </button>
  </header>

  <!-- Game Grid Container (4x2 Grid for 8 Tiles) -->
  <main class="w-full max-w-md aspect-[4/2] relative">
    <!-- 4x2 Grid -->
    <div id="game-grid" class="grid grid-cols-4 grid-rows-2 gap-3 w-full h-full p-3 bg-purple-950/40 rounded-2xl border border-purple-900/40 backdrop-blur-md">
      <!-- 8 Cards will be dynamically inserted here -->
    </div>

    <!-- Game Over / Victory Overlay -->
    <div id="modal-overlay" class="absolute inset-0 bg-black/90 rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20 hidden backdrop-blur-md border-2 border-orange-600">
      <h2 id="modal-title" class="spooky-font text-4xl sm:text-5xl text-green-400 mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(74,222,128,0.8)]">
        VICTORY!
      </h2>
      <p id="modal-subtitle" class="spooky-font text-xl sm:text-2xl text-purple-300 mb-6">
        Completed in 0 flips and 0s!
      </p>
      <button id="play-again-btn" onclick="restartGame()" class="spooky-font text-2xl text-black bg-gradient-to-r from-orange-500 to-amber-400 hover:from-orange-400 hover:to-amber-300 active:scale-95 px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(255,119,0,0.6)] transition-all transform hover:scale-105">
        PLAY AGAIN
      </button>
    </div>
  </main>

  <script>
    // Audio Synthesizer Engine (Web Audio API)
    class SpookyAudioEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlipSound() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(250, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playMatchSound() {
        this.init();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.2, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.2);
        });
      }

      playWrongSound() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      playWinSound() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.25, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.4);
        });
      }

      playCharacterSound(id) {
        this.init();
        const now = this.ctx.currentTime;

        switch (id) {
          case 'bat': {
            // High-pitched fast squeaks/chirps
            for (let i = 0; i < 3; i++) {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(2400 + i * 200, now + i * 0.06);
              osc.frequency.exponentialRampToValueAtTime(1200, now + i * 0.06 + 0.04);
              gain.gain.setValueAtTime(0.15, now + i * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.04);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.06);
              osc.stop(now + i * 0.06 + 0.04);
            }
            break;
          }
          case 'ghost': {
            // Low eerie oscillating "Booo" sound
            const osc = this.ctx.createOscillator();
            const lfo = this.ctx.createOscillator();
            const lfoGain = this.ctx.createGain();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.25);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.5);

            lfo.frequency.value = 8;
            lfoGain.gain.value = 25;
            lfo.connect(osc.frequency);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.15);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            lfo.start(now);
            osc.start(now);
            lfo.stop(now + 0.5);
            osc.stop(now + 0.5);
            break;
          }
          case 'mummy': {
            // Low groaning/grunting frequency modulation sound
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.linearRampToValueAtTime(75, now + 0.4);
            
            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.25, now + 0.1);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
          }
          case 'witch': {
            // Cackling high pitched sliding pitch bend
            [600, 850, 650, 950, 700].forEach((freq, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + idx * 0.06);
              osc.frequency.exponentialRampToValueAtTime(freq + 200, now + idx * 0.06 + 0.05);
              gain.gain.setValueAtTime(0.15, now + idx * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.05);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + idx * 0.06);
              osc.stop(now + idx * 0.06 + 0.05);
            });
            break;
          }
        }
      }
    }

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // Timer controls
    function startTimer() {
      if (!timerStarted) {
        timerStarted = true;
        timerInterval = setInterval(() => {
          timerSeconds++;
          timerElement.textContent = `${timerSeconds}s`;
        }, 1000);
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerStarted = false;
    }

    // Render game board (Cards start face down)
    function renderBoard() {
      gridElement.innerHTML = '';
      cards.forEach((card, index) => {
        const cardNode = document.createElement('div');
        cardNode.className = 'card card-container w-full h-full cursor-pointer';
        cardNode.dataset.index = index;

        cardNode.innerHTML = `
          <div class="card-inner">
            <!-- Back of Card (Face Down) -->
            <div class="card-back flex flex-col items-center justify-center p-2">
              <span class="text-3xl sm:text-4xl select-none opacity-80">🎃</span>
            </div>
            <!-- Front of Card (Face Up) -->
            <div class="card-front flex items-center justify-center p-2">
              <div class="flex items-center justify-center w-full h-full p-1">
                <img src="${card.img}" alt="${card.name}" class="w-full h-full object-contain">
              </div>
            </div>
          </div>
        `;

        cardNode.addEventListener('click', () => handleCardClick(index));
        gridElement.appendChild(cardNode);
      });
    }

    // Card Click Handler
    function handleCardClick(index) {
      if (isProcessing) return;

      const cardElement = gridElement.children[index];

      if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) {
        return;
      }

      startTimer();

      soundEngine.playFlipSound();
      playPronunciation(cards[index].id);

      cardElement.classList.add('flipped');
      flippedCards.push({ index, card: cards[index], element: cardElement });

      flipCount++;
      flipsElement.textContent = flipCount;

      if (flippedCards.length === 2) {
        isProcessing = true;
        checkMatch();
      }
    }

    // Check Match
    function checkMatch() {
      const [first, second] = flippedCards;

      if (first.card.id === second.card.id) {
        setTimeout(() => {
          soundEngine.playMatchSound();
          first.element.classList.add('matched');
          second.element.classList.add('matched');

          matchesFound += 1;
          flippedCards = [];

          if (matchesFound === 4) {
            triggerEndGame();
          } else {
            isProcessing = false;
          }
        }, 400);

      } else {
        setTimeout(() => {
          soundEngine.playWrongSound();
          first.element.classList.add('shake');
          second.element.classList.add('shake');

          setTimeout(() => {
            first.element.classList.remove('flipped', 'shake');
            second.element.classList.remove('flipped', 'shake');
            flippedCards = [];
            isProcessing = false;
          }, 600);
        }, 500);
      }
    }

    // Victory Celebration
    function triggerEndGame() {
      stopTimer();
      isProcessing = true;
      soundEngine.playWinSound();

      // Trigger Confetti
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      setTimeout(() => {
        modalTitle.textContent = 'VICTORY!';
        modalSubtitle.textContent = `Completed in ${flipCount} flips and ${timerSeconds}s!`;
        modalOverlay.classList.remove('hidden');
      }, 500);
    }

    // Restart Game
    function restartGame() {
      stopTimer();

      flipCount = 0;
      timerSeconds = 0;
      matchesFound = 0;
      flippedCards = [];
      isProcessing = false;
      
      flipsElement.textContent = '0';
      timerElement.textContent = '0s';
      modalOverlay.classList.add('hidden');

      cards = generateDeck();
      renderBoard();
    }

    window.onload = function() {
      restartGame();
    };
  </script>
</body>
</html>
